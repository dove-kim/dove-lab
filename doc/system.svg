<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="980" height="720" fill="#f8f9fa"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2980b9"/></marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/></marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/></marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#aaa"/></marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e67e22"/></marker>
  </defs>

  <!-- ══════════ SECTION 1: 수집 · 계산 (scheduler) ══════════ -->
  <text x="20" y="28" font-size="11" fill="#888">수집 · 계산 (scheduler — 잡마다 독립 스레드)</text>
  <line x1="16" y1="35" x2="964" y2="35" stroke="#ddd" stroke-width="1"/>

  <!-- scheduler box -->
  <rect x="30" y="50" width="360" height="290" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="210" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">scheduler</text>
  <line x1="44" y1="85" x2="376" y2="85" stroke="#eee" stroke-width="1"/>
  <text x="48" y="104" font-size="10" fill="#555">● 06:00 — DART 고유번호 주간 동기화</text>
  <text x="48" y="124" font-size="10" fill="#555">● 08:05 (평일) — KRX 당일 종목 동기화</text>
  <text x="48" y="144" font-size="10" fill="#555">● 12:00 — 종목상세 · 투자자동향 · 권리이벤트</text>
  <text x="48" y="168" font-size="10" fill="#555">● 21:00 (평일) — 일일 파이프라인</text>
  <text x="62" y="186" font-size="10" fill="#888">· 당일 주가 수집 → 기술지표 계산</text>
  <text x="62" y="202" font-size="10" fill="#888">· 횡단면 순위(rank) · 커스텀 지표(custom-metric)</text>
  <text x="62" y="218" font-size="10" fill="#888">· DART 재무 · 상장주식수 · 일별 밸류에이션</text>
  <text x="62" y="234" font-size="10" fill="#888">· ML 모델 채점 (score.py 실행)</text>
  <line x1="44" y1="248" x2="376" y2="248" stroke="#eee" stroke-width="1"/>
  <text x="48" y="266" font-size="10" fill="#555">커서 기반 · 멱등(밀림 허용) · 진행률 → Redis</text>
  <text x="48" y="286" font-size="10" fill="#888">역사적 대량 수집 = 백필 API / 별도 스크립트</text>
  <text x="48" y="306" font-size="10" fill="#888">동시성 = Parallel(가상스레드) · 율제한 = 게이트</text>

  <!-- external API boxes -->
  <rect x="800" y="64" width="150" height="58" rx="8" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="875" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">KRX</text>
  <text x="875" y="105" text-anchor="middle" font-size="9" fill="#2980b9">종목 · 일별시세 · 상장주식수</text>

  <rect x="800" y="140" width="150" height="58" rx="8" fill="#fef9ec" stroke="#e67e22" stroke-width="1.5"/>
  <text x="875" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">KIS</text>
  <text x="875" y="181" text-anchor="middle" font-size="9" fill="#e67e22">주가 · 상세 · 투자자동향 (20/s)</text>

  <rect x="800" y="216" width="150" height="58" rx="8" fill="#fdf2f8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="875" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e44ad">DART</text>
  <text x="875" y="257" text-anchor="middle" font-size="9" fill="#8e44ad">재무제표 · 고유번호 · 공시</text>

  <!-- scheduler → external -->
  <line x1="390" y1="93" x2="798" y2="93" stroke="#2980b9" stroke-width="1.4" marker-end="url(#arrBlue)"/>
  <line x1="390" y1="169" x2="798" y2="169" stroke="#e67e22" stroke-width="1.4" marker-end="url(#arrOrange)"/>
  <line x1="390" y1="245" x2="798" y2="245" stroke="#8e44ad" stroke-width="1.4" marker-end="url(#arrPurple)"/>
  <text x="595" y="86" text-anchor="middle" font-size="9" fill="#2980b9">Feign — 종목 목록</text>
  <text x="595" y="162" text-anchor="middle" font-size="9" fill="#e67e22">Feign — 주가 · 투자자동향</text>
  <text x="595" y="238" text-anchor="middle" font-size="9" fill="#8e44ad">Feign — 재무제표</text>

  <!-- scheduler → storage (down) -->
  <line x1="210" y1="340" x2="210" y2="390" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="228" y="368" font-size="10" fill="#555">저장</text>

  <!-- ══════════ SECTION 2: 데이터 저장소 ══════════ -->
  <text x="20" y="368" font-size="11" fill="#888">데이터 저장소</text>
  <line x1="16" y1="375" x2="964" y2="375" stroke="#ddd" stroke-width="1"/>

  <!-- MySQL outer -->
  <rect x="20" y="390" width="720" height="222" rx="10" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="732" y="404" font-size="10" fill="#aaa" text-anchor="end">MySQL 8</text>

  <!-- row A -->
  <rect x="34" y="404" width="218" height="58" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/>
  <text x="143" y="423" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">주식 · 주가 · 상세 · 이벤트</text>
  <text x="143" y="439" text-anchor="middle" font-size="9" fill="#555">STOCK · STOCK_PRICE · STOCK_DETAIL</text>
  <text x="143" y="452" text-anchor="middle" font-size="9" fill="#555">STOCK_EVENT · STOCK_TAG_VALUE</text>

  <rect x="265" y="404" width="218" height="58" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.3"/>
  <text x="374" y="423" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a085">지표 · 순위 · 커스텀 지표</text>
  <text x="374" y="439" text-anchor="middle" font-size="9" fill="#555">STOCK_FEATURE_DAILY · STOCK_RANK_DAILY</text>
  <text x="374" y="452" text-anchor="middle" font-size="9" fill="#555">CUSTOM_METRIC_DEF/DAILY · *_CURSOR (CAS)</text>

  <rect x="496" y="404" width="230" height="58" rx="6" fill="#fef9ec" stroke="#e67e22" stroke-width="1.3"/>
  <text x="611" y="423" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">재무 · 밸류에이션 (PIT)</text>
  <text x="611" y="439" text-anchor="middle" font-size="9" fill="#555">STOCK_FUNDAMENTAL · STOCK_VALUATION_DAILY</text>
  <text x="611" y="452" text-anchor="middle" font-size="9" fill="#555">STOCK_SHARE_COUNT</text>

  <!-- row B -->
  <rect x="34" y="470" width="218" height="58" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/>
  <text x="143" y="489" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">투자자 동향</text>
  <text x="143" y="507" text-anchor="middle" font-size="9" fill="#555">INVESTOR_DAILY</text>
  <text x="143" y="520" text-anchor="middle" font-size="9" fill="#888">(기관 · 외국인 · 개인)</text>

  <rect x="265" y="470" width="218" height="58" rx="6" fill="#fdf2f8" stroke="#8e44ad" stroke-width="1.3"/>
  <text x="374" y="489" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">ML 모델 · 채점</text>
  <text x="374" y="507" text-anchor="middle" font-size="9" fill="#555">ML_MODEL · STOCK_MODEL_SCORE</text>
  <text x="374" y="520" text-anchor="middle" font-size="9" fill="#888">아티팩트 실행 = score.py</text>

  <rect x="496" y="470" width="230" height="58" rx="6" fill="#eef2f7" stroke="#2c3e50" stroke-width="1.3"/>
  <text x="611" y="489" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">검색 필터 · 프리셋</text>
  <text x="611" y="507" text-anchor="middle" font-size="9" fill="#555">SEARCH_FILTER · STOCK_FILTER</text>
  <text x="611" y="520" text-anchor="middle" font-size="9" fill="#888">사용자 정의 종목 필터 · 지표 프리셋</text>

  <!-- row C -->
  <rect x="34" y="536" width="218" height="58" rx="6" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.3"/>
  <text x="143" y="555" text-anchor="middle" font-size="10" font-weight="bold" fill="#2980b9">회원 · 권한(capability)</text>
  <text x="143" y="573" text-anchor="middle" font-size="9" fill="#555">MEMBER · MEMBER_CAPABILITY_GRANT</text>
  <text x="143" y="586" text-anchor="middle" font-size="9" fill="#888">USER_MODULE / FEATURE_DISPLAY</text>

  <rect x="265" y="536" width="218" height="58" rx="6" fill="#fdf2f8" stroke="#8e44ad" stroke-width="1.3"/>
  <text x="374" y="555" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">자격증명</text>
  <text x="374" y="573" text-anchor="middle" font-size="9" fill="#555">CREDENTIAL · INVITE_CODE</text>

  <rect x="496" y="536" width="230" height="58" rx="6" fill="#f2f2f2" stroke="#7f8c8d" stroke-width="1.3"/>
  <text x="611" y="555" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f8c8d">시장 · 운영 이벤트</text>
  <text x="611" y="573" text-anchor="middle" font-size="9" fill="#555">EXCHANGE_TRADING_DATE · SYSTEM_EVENT</text>
  <text x="611" y="586" text-anchor="middle" font-size="9" fill="#888">거래일 · 수집/계산 실패 모니터링</text>

  <!-- Redis -->
  <rect x="756" y="404" width="204" height="58" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="858" y="427" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Redis</text>
  <text x="858" y="445" text-anchor="middle" font-size="9" fill="#c0392b">스케줄러 진행률 (job-status)</text>

  <!-- ══════════ SECTION 3: 서비스 / 클라이언트 ══════════ -->
  <text x="20" y="640" font-size="11" fill="#888">서비스 / 클라이언트</text>
  <line x1="16" y1="647" x2="964" y2="647" stroke="#ddd" stroke-width="1"/>

  <rect x="30" y="662" width="90" height="50" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
  <text x="75" y="691" text-anchor="middle" font-size="12" fill="#555">브라우저</text>

  <line x1="120" y1="687" x2="153" y2="687" stroke="#aaa" stroke-width="1.2" marker-end="url(#arrGray)"/>

  <rect x="155" y="662" width="130" height="50" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="220" y="683" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">web</text>
  <text x="220" y="700" text-anchor="middle" font-size="9" fill="#777">Next.js (App Router)</text>

  <line x1="285" y1="687" x2="333" y2="687" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="309" y="679" text-anchor="middle" font-size="9" fill="#555">HTTP · JWT</text>

  <rect x="335" y="662" width="150" height="50" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="410" y="683" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">api</text>
  <text x="410" y="700" text-anchor="middle" font-size="9" fill="#777">Spring Boot REST (:8081)</text>
  <text x="500" y="683" font-size="9" fill="#888">인증 · 주식 데이터 조회 · 권한(capability)</text>
  <text x="500" y="697" font-size="9" fill="#888">· 검색 실행 · 운영(수집·스케줄러) 관리</text>

  <!-- api → storage (up, 조회) -->
  <line x1="410" y1="662" x2="410" y2="612" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="428" y="640" font-size="10" fill="#555">조회</text>

  <!-- footer -->
  <text x="960" y="712" text-anchor="end" font-size="9" fill="#bbb">헥사고날 멀티모듈 · Spring Boot 3 / Java 21 · Next.js</text>
</svg>
