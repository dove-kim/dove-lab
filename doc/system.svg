<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="940" height="590" fill="#f8f9fa"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2980b9"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- ══════════ SECTION 1: 주식 데이터 수집 ══════════ -->
  <text x="20" y="28" font-size="11" fill="#888">주식 데이터 수집</text>
  <line x1="16" y1="35" x2="924" y2="35" stroke="#ddd" stroke-width="1"/>

  <!-- scheduler box -->
  <rect x="30" y="50" width="210" height="210" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="135" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">scheduler</text>
  <line x1="44" y1="85" x2="226" y2="85" stroke="#eee" stroke-width="1"/>
  <text x="48" y="102" font-size="10" fill="#555">● StockSyncJob</text>
  <text x="48" y="116" font-size="10" fill="#888">   08:05 KST (평일)</text>
  <text x="48" y="133" font-size="10" fill="#555">● StockDetailJob</text>
  <text x="48" y="147" font-size="10" fill="#888">   12:00 KST — 종목상세·투자자동향·이벤트</text>
  <text x="48" y="164" font-size="10" fill="#555">● DailyPriceJob</text>
  <text x="48" y="178" font-size="10" fill="#888">   21:00 KST (평일)</text>
  <text x="48" y="195" font-size="10" fill="#555">● IndicatorJob</text>
  <text x="48" y="209" font-size="10" fill="#888">   00:00 KST — 커서 기반 기술지표 계산</text>

  <!-- arrow scheduler → KIS (주가 수집) -->
  <line x1="240" y1="160" x2="688" y2="160" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrOrange)"/>
  <text x="464" y="150" text-anchor="middle" font-size="10" fill="#e67e22">KIS API (주가·상세·투자자동향)</text>

  <!-- arrow scheduler → KRX (종목 동기화) -->
  <line x1="240" y1="100" x2="688" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="464" y="90" text-anchor="middle" font-size="10" fill="#555">KRX API (종목 목록)</text>

  <!-- KRX box -->
  <rect x="690" y="70" width="90" height="56" rx="8" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="735" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">KRX</text>
  <text x="735" y="111" text-anchor="middle" font-size="10" fill="#2980b9">종목 목록</text>

  <!-- KIS box -->
  <rect x="690" y="133" width="90" height="56" rx="8" fill="#fef9ec" stroke="#e67e22" stroke-width="1.5"/>
  <text x="735" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">KIS</text>
  <text x="735" y="174" text-anchor="middle" font-size="10" fill="#e67e22">주가·투자자동향</text>

  <!-- arrow scheduler → MySQL (down) -->
  <line x1="135" y1="260" x2="135" y2="328" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="153" y="298" font-size="10" fill="#555">저장</text>

  <!-- ══════════ SECTION 2: 데이터 저장소 ══════════ -->
  <text x="20" y="312" font-size="11" fill="#888">데이터 저장소</text>
  <line x1="16" y1="319" x2="924" y2="319" stroke="#ddd" stroke-width="1"/>

  <!-- MySQL outer -->
  <rect x="20" y="333" width="800" height="98" rx="10" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="836" y="349" font-size="10" fill="#aaa">MySQL 8</text>

  <!-- stock sub-box -->
  <rect x="35" y="346" width="265" height="70" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/>
  <text x="167" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">주식 · 주가 · 지표 · 투자자동향</text>
  <text x="167" y="385" text-anchor="middle" font-size="10" fill="#555">STOCK, STOCK_PRICE, STOCK_FEATURE_DAILY</text>
  <text x="167" y="398" text-anchor="middle" font-size="10" fill="#555">INDICATOR_CURSOR, INVESTOR_DAILY</text>

  <!-- user sub-box -->
  <rect x="320" y="346" width="145" height="70" rx="6" fill="#eaf4fb" stroke="#2980b9" stroke-width="1.4"/>
  <text x="393" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#2980b9">회원 프로필</text>
  <text x="393" y="388" text-anchor="middle" font-size="10" fill="#555">MEMBER</text>
  <text x="393" y="401" text-anchor="middle" font-size="10" fill="#555">USER_FEATURE_GRANT …</text>

  <!-- auth sub-box -->
  <rect x="485" y="346" width="155" height="70" rx="6" fill="#fdf2f8" stroke="#8e44ad" stroke-width="1.4"/>
  <text x="563" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#8e44ad">자격증명</text>
  <text x="563" y="388" text-anchor="middle" font-size="10" fill="#555">CREDENTIAL</text>
  <text x="563" y="401" text-anchor="middle" font-size="10" fill="#555">INVITE_CODE …</text>

  <!-- ══════════ SECTION 3: 서비스 / 클라이언트 ══════════ -->
  <text x="20" y="454" font-size="11" fill="#888">서비스 / 클라이언트</text>
  <line x1="16" y1="461" x2="924" y2="461" stroke="#ddd" stroke-width="1"/>

  <!-- browser box -->
  <rect x="30" y="478" width="90" height="56" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
  <text x="75" y="503" text-anchor="middle" font-size="12" fill="#555">브라우저</text>

  <!-- arrow browser → web -->
  <line x1="120" y1="506" x2="153" y2="506" stroke="#aaa" stroke-width="1.2" marker-end="url(#arrGray)"/>

  <!-- web box -->
  <rect x="155" y="478" width="130" height="56" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="220" y="503" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">web</text>
  <text x="220" y="521" text-anchor="middle" font-size="10" fill="#777">Next.js</text>

  <!-- arrow web → api -->
  <line x1="285" y1="506" x2="333" y2="506" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="309" y="498" text-anchor="middle" font-size="10" fill="#555">HTTP</text>

  <!-- api box -->
  <rect x="335" y="478" width="130" height="56" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="503" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">api</text>
  <text x="400" y="521" text-anchor="middle" font-size="10" fill="#777">Spring Boot REST</text>

  <!-- arrow api → stock DB (up) -->
  <line x1="375" y1="478" x2="220" y2="431" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arrGreen)"/>
  <!-- arrow api → user DB (up) -->
  <line x1="400" y1="478" x2="393" y2="431" stroke="#2980b9" stroke-width="1.2" marker-end="url(#arrBlue)"/>
  <!-- arrow api → auth DB (up) -->
  <line x1="425" y1="478" x2="530" y2="431" stroke="#8e44ad" stroke-width="1.2" marker-end="url(#arrPurple)"/>

</svg>
