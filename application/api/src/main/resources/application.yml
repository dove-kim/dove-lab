server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: api
  mvc:
    problemdetails:
      enabled: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/DOVE_LAB?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&connectTimeout=10000&socketTimeout=120000
    username: ${DB_USERNAME:dove_app}
    password: ${DB_PASSWORD:dove1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000   # KIS·KRX 외부 호출 상한 (무한 대기 방지)
            read-timeout: 30000

krx:
  api:
    daily-quota: ${KRX_DAILY_QUOTA:6000}

jwt:
  secret: ${JWT_SECRET:dove-lab-local-dev-secret-key-minimum-32-characters}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}        # 15분
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}  # 30일

logging:
  level:
    root: INFO
    com.dove: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: INFO

init:
  admin:
    username: ${INIT_ADMIN_USERNAME:}
    password: ${INIT_ADMIN_PASSWORD:}
