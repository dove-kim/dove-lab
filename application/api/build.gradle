bootJar {
    enabled = true
    archiveFileName = "api.jar"
}
jar {
    enabled = false
}

// 운영 채점용 Python 스크립트(score.py)와 런타임 의존성 핀(requirements.txt)을 도커 빌드 컨텍스트(build/scoring)로 복사한다.
// 단일 원천 = rootDir/scripts/scoring/. (모델 활성화 드라이런이 ProcessBuilder로 호출)
tasks.register('copyScoringScript', Copy) {
    from rootProject.file('scripts/scoring')
    into layout.buildDirectory.dir('scoring')
}
bootJar.dependsOn copyScoringScript
bootRun {
    enabled = true
}

dependencies {
    implementation project(":logging")
    implementation project(":market")
    implementation project(":stock")
    implementation project(":indicator")
    implementation project(":auth")
    implementation project(":user")
    implementation project(":screening")
    implementation project(":model-serving")
    implementation project(":custom-metric")
    implementation project(":user-feature")
    implementation project(":system-event")
    implementation project(":api-quota")
    implementation project(":stock-collection")
    implementation project(":job-status")
    implementation project(":fundamental")
    implementation project(":portfolio")
    runtimeOnly project(":krx")
    implementation project(":kis")
    implementation project(":frankfurter")
    implementation project(":investor-flow")

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'


    testImplementation project(':jpa')
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.redisson:redisson:3.27.2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
