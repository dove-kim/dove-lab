spring:
  application:
    name: scheduler

  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:5}   # @Scheduled 잡마다 독립 스레드(잡 수 + 여유). 한 잡이 오래 걸려도 다른 잡을 막지 않음.

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/DOVE_LAB?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true&connectTimeout=10000&socketTimeout=120000
    username: ${DB_USERNAME:dove_app}
    password: ${DB_PASSWORD:dove1234}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      auto-commit: true

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100        # INSERT/UPDATE를 묶어 DB 라운드트립 감소 (지표 대량 저장 가속)
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000   # KIS·KRX 외부 호출 상한 (무한 대기 방지)
            read-timeout: 30000

krx:
  api:
    auth-key: ${KRX_API_AUTH_KEY:}
    daily-quota: ${KRX_DAILY_QUOTA:6000}

market:
  data:
    initial-date: ${MARKET_INITIAL_DATE:2010-01-01}

collection:
  concurrency: ${COLLECTION_CONCURRENCY:40}  # KIS·KRX 동시 실행 수. 실제 속도는 KisGate/per-second가 제어.

indicator:
  concurrency: ${INDICATOR_CONCURRENCY:10}   # 지표 계산 동시 그룹 수. API 아님(DB/코어 기준). DB 풀(20) 이내.
  start-date: ${INDICATOR_START_DATE:}        # 계산 시작일 하한(비우면 전체 이력). 최초 계산량 제한용 — 예: 2026-01-01

logging:
  level:
    root: INFO
    com.dove: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: INFO
    org.springframework.scheduling: INFO
    # local 잡 1회 실행 후 종료 시 Redisson(Netty) 이벤트 루프가 닫히며 나는 무해한 종료 노이즈 억제
    io.netty.util.concurrent.DefaultPromise.rejectedExecution: 'OFF'
